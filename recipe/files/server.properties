# ReadyStack Apache Kafka: the default configuration of this image (KRaft, one node that is both
# broker and controller). It is upstream's docker/server.properties (Apache Kafka 4.4.0) with one change:
# log.dirs is /var/lib/kafka/data, the image's data volume, instead of /tmp/kraft-combined-logs, so topic
# data survives a recreated container when /var/lib/kafka/data is a volume.
#
# Upstream's image rules apply unchanged: when ANY KAFKA_* server property is passed as an environment
# variable (KAFKA_NODE_ID, KAFKA_ADVERTISED_LISTENERS, ...), this file is NOT used and the configuration is
# built from the environment variables alone, so pass a complete set (see the admin handbook). A
# server.properties mounted in /mnt/shared/config replaces this file, and KAFKA_* variables are added to it.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
log.dirs=/var/lib/kafka/data
num.partitions=1
num.recovery.threads.per.data.dir=2
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
